name: Release & Package Windows Executables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Tests
        run: |
          npm run check
          npm test

      - name: Extract Version and Auto-Tag
        id: get_version
        shell: bash
        run: |
          RAW_VERSION=$(node -p "require('./package.json').version")
          TAG="v${RAW_VERSION}"

          # 若為手動下 tag 觸發，直接使用該 tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            RAW_VERSION="${TAG#v}"
          elif git rev-parse "${TAG}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "${TAG}^{commit}" 2>/dev/null || git rev-parse "${TAG}")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag ${TAG} already exists on older commit (${TAG_COMMIT}). Auto-bumping patch version for new release on main..."
              npm version patch --no-git-tag-version
              RAW_VERSION=$(node -p "require('./package.json').version")
              TAG="v${RAW_VERSION}"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -am "chore(release): auto-bump version to ${RAW_VERSION} [skip ci]" || true
              git push origin main || true
            fi
          fi

          echo "version=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release target: ${TAG} (Version: ${RAW_VERSION})"

      - name: Build Web Renderer
        run: npm run build

      - name: Package Windows Executables (Win-Unpacked, Portable & Zip)
        run: |
          npx electron-builder --win dir portable zip --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Setup & Updater (C# WPF)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File installer/build_installer.ps1 -RebuildPayload

      - name: Generate Update Manifest (latest.json)
        run: |
          node installer/generate_manifest.js

      - name: Verify Custom Installer Integrity
        shell: powershell
        run: |
          node -e "
          const fs = require('fs');
          const buf = fs.readFileSync('DebateCompanionSetup.exe');
          if (buf.includes(Buffer.from('Nullsoft'))) {
            throw new Error('CRITICAL: DebateCompanionSetup.exe was contaminated by NSIS!');
          }
          if (!buf.includes(Buffer.from('BSJB'))) {
            throw new Error('CRITICAL: DebateCompanionSetup.exe is missing .NET CLR runtime header!');
          }
          if (buf.length < 50000000) {
            throw new Error('CRITICAL: DebateCompanionSetup.exe is too small (' + buf.length + ' bytes), payload may be missing!');
          }
          console.log('Integrity check PASSED: Genuine C# WPF installer verified (' + buf.length + ' bytes)');
          "

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ format('v{0} - 辯論陪伴台帳正式發行版', steps.get_version.outputs.version) }}
          files: |
            DebateCompanionSetup.exe
            release/*.exe
            release/*.zip
            installer/publish/latest.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
