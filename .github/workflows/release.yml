name: Release & Package Windows Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Tests
        run: |
          npm run check
          npm test

      - name: Build Web Renderer
        run: npm run build

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Package Windows Executables (NSIS, Portable, Zip)
        run: |
          npx electron-builder --win nsis portable zip --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Setup & Updater (C# WPF)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File installer/build_installer.ps1 -RebuildPayload

      - name: Generate Update Manifest (latest.json)
        run: |
          node installer/generate_manifest.js

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.get_version.outputs.version) }}
          name: ${{ format('v{0} - 辯論陪伴台帳熱修復與最新正式發行版', steps.get_version.outputs.version) }}
          files: |
            release/*.exe
            release/*.zip
            DebateCompanionSetup.exe
            installer/publish/latest.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
