name: Release & Package Windows Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Tests
        run: |
          npm run check
          npm test

      - name: Build Web Renderer
        run: npm run build

      - name: Package Windows Executables (NSIS, Portable, Zip)
        run: |
          npx electron-builder --win nsis portable zip

      - name: Build Native Setup & Updater (C# WPF)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File installer/build_installer.ps1 -RebuildPayload

      - name: Generate Update Manifest (latest.json)
        run: |
          node installer/generate_manifest.js

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release/*.exe
            release/*.zip
            DebateCompanionSetup.exe
            installer/publish/latest.json
          generate_release_notes: true
          draft: false
          prerelease: false
