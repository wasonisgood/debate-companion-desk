name: Release & Package Windows Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Renderer & Electron Logic
        run: npm run build

      - name: Run Verification Tests
        run: npm test

      - name: Package Windows Binary and Embedded Installer
        run: |
          powershell -ExecutionPolicy Bypass -File installer/build_installer.ps1

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            DebateCompanionSetup.exe
            installer/publish/latest.json
            installer/DebateCompanionUpdater.exe
            installer/uninstall.exe
          generate_release_notes: true
          draft: false
          prerelease: false
