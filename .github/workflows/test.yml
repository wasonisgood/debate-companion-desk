name: Test & Lint Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Type Check & Lint
        run: npm run check

      - name: Run Unit Tests
        run: npm test

      - name: Compile Native Windows Installers
        run: powershell -ExecutionPolicy Bypass -File installer/build_installer.ps1
